<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>FLASK CRUD 1.6</title>
  <!-- <link rel="stylesheet" href="https://bootswatch.com/5/cosmo/bootstrap.min.css"> -->
  <link rel="stylesheet" href="https://bootswatch.com/5/brite/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <script>
    {% if session.get("user_id") %}
      // Carga el tema guardado o  por defecto claro
      const theme = localStorage.getItem('theme_{{ session.get("user_id") }}') || 'light';
    {% else %}
      // fuera de la sesion siempre claro
      const theme = 'light';
    {% endif %}
    document.documentElement.setAttribute('data-bs-theme', theme);
  </script>
</head>

<body>
  {% with messages = get_flashed_messages() %} 
    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>{{ message }}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endfor %}
    {% endif %} 
  {% endwith %}


<nav class="navbar navbar-expand-lg bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand text-black" href="#">CRUD</a>
    {% if session.get("user_id") %}
    <div class="d-flex">
      <div class="nav-item pe-3 pt-2 text-black">{{ session.get("user_id") }}</div>
      <li class="nav-item dropdown" style="list-style: none;">
        <a class="nav-link dropdown-toggle pe-3 pt-2 text-black" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">
          <i class="bi bi-circle-half fs-5"></i>
        </a>
        <div class="dropdown-menu" data-bs-popper="static">
          <a class="dropdown-item theme-switch" href="#" data-bs-theme="light" data-user="{{ session.get('user_id') }}">CLARO</a>
          <a class="dropdown-item theme-switch" href="#" data-bs-theme="dark" data-user="{{ session.get('user_id') }}">OSCURO</a>
        </div>
      </li>
      <a href="{{url_for('logout')}}" class="btn btn-secondary my-2 my-sm-0" type="submit">Salir</a>
    </div>
    {% endif %}
  </div>
</nav>

  <div class="container pt-4">
    {% block body %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
          crossorigin="anonymous"></script>
  <script src="{{url_for('static', filename='js/main.js')}}"></script>
</body>
</html>
