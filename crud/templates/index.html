{% extends "layout.html" %}
{% block body %}
<div class="row">
  <div class="col-md-8 mx-auto">
    
    </div>
          <div class="card card-body mb-4">
        <form action="{{url_for('add_dispositivo')}}" method="POST">
          <legend>cargar dispositivo</legend>
          <div class="form-group">
            <label class="col-form-label mt-2" for="id_dispositivo">ID del dispositivo </label>
            <input type="text" class="form-control" id="id_dispositivo" name="id_dispositivo" required>
          </div>
          <div class="form-group">
            <label class="col-form-label mt-2" for="nombre">nombre de la placa</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>
          <button type="submit" class="btn btn-primary mt-4">guardar dispositivo</button>
        </form>
      </div>

    <div class="card card-body border-info mb-4">
      <form action="{{ url_for('enviar_comando') }}" method="POST">
        <legend>Control MQTTS</legend>
        <div class="form-group">
          <label class="col-form-label mt-2">Seleccionar nodo destinatario</label>
          <select class="form-select" name="nodo_destinatario" required>
            <option value="" disabled selected>Seleccione un dispositivo...</option>
            {% for dispositivo in dispositivos %}
              <option value="{{ dispositivo.0 }}">{{ dispositivo.1 }} ({{ dispositivo.0 }})</option>
            {% endfor %}
          </select>
        </div>


        <div class="row align-items-end mt-3">
          <div class="col-md-6">
            <button type="submit" name="accion" value="destello" class="btn btn-warning w-50 mt-3">enviar destello</button>
          </div>

          <div class="col-md-6 mt-3">
            <label class="form-label mb-1">modificar setpoint</label>
            <div class="input-group">
              <input type="number" step="0.1" class="form-control" name="nuevo_setpoint" placeholder="Ej: 25">
              <button type="submit" name="accion" value="setpoint" class="btn btn-info">
                Actualizar
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>

  </div>
</div>

<div class="row pt-4">
  <div class="col-md-8 mx-auto">
    <table class="table table-hover table-default">
      <thead>
        <tr>
          <th scope="col">ID Dispositivo</th>
          <th scope="col">Nombre</th>
          <th scope="col">Setpoint Actual</th>
          <th scope="col">Acción</th>
        </tr>
      </thead>
      <tbody>
        {% for dispositivo in dispositivos %}
        <tr>
          <td>{{dispositivo.0}}</td>
          <td>{{dispositivo.1}}</td>
          <td>{{dispositivo.2}}</td>
          <td>
            <a href="{{url_for('conseguir_dispositivo', id=dispositivo.0)}}" class="btn btn-secondary btn-sm">Editar</a>
            <a href="{{url_for('borrar_dispositivo', id=dispositivo.0)}}" class="btn btn-danger btn-sm btn-borrar">Borrar</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
